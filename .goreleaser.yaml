version: 2

project_name: weave

builds:
  - id: weave
    main: ./cmd/weave
    binary: weave
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/TheFellow/weave/internal/buildinfo.Version={{.Version}}
        -X github.com/TheFellow/weave/internal/buildinfo.Commit={{.Commit}}
        -X github.com/TheFellow/weave/internal/buildinfo.Date={{.Date}}
  - id: weave-cpp
    main: ./adapters/cpp/cmd/weave-cpp
    binary: weave-cpp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: weave-typescript
    main: ./adapters/typescript/cmd/weave-typescript
    binary: weave-typescript
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: weave-jvm
    main: ./adapters/jvm/cmd/weave-jvm
    binary: weave-jvm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  # This is the protocol wrapper only. Universal Ctags is a separately
  # installed GPL-2.0 producer and is intentionally not bundled or linked.
  - id: weave-ctags
    main: ./adapters/ctags/cmd/weave-ctags
    binary: weave-ctags
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: weave
    ids: [weave]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
  - id: weave-adapters
    ids: [weave-cpp, weave-typescript, weave-jvm, weave-ctags]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      weave_adapters_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - adapters/cpp/README.md
      - adapters/typescript/README.md
      - adapters/jvm/README.md
      - adapters/ctags/README.md

checksum:
  name_template: checksums.txt

release:
  extra_files:
    - glob: ./adapter-dist/*

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
