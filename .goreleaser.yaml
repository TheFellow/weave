version: 2

project_name: weave

builds:
  - id: weave
    main: ./cmd/weave
    binary: weave
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/TheFellow/weave/internal/buildinfo.Version={{.Version}}
        -X github.com/TheFellow/weave/internal/buildinfo.Commit={{.Commit}}
        -X github.com/TheFellow/weave/internal/buildinfo.Date={{.CommitDate}}
  - id: weave-cpp
    main: ./adapters/cpp/cmd/weave-cpp
    binary: weave-cpp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
  - id: weave-typescript
    main: ./adapters/typescript/cmd/weave-typescript
    binary: weave-typescript
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
  - id: weave-jvm
    main: ./adapters/jvm/cmd/weave-jvm
    binary: weave-jvm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
  # This is the protocol wrapper only. Universal Ctags is a separately
  # installed GPL-2.0 producer and is intentionally not bundled or linked.
  - id: weave-ctags
    main: ./adapters/ctags/cmd/weave-ctags
    binary: weave-ctags
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w

archives:
  - id: weave
    ids: [weave]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info: &release_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info: *release_file_info
  - id: weave-adapters
    ids: [weave-cpp, weave-typescript, weave-jvm, weave-ctags]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      weave_adapters_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info: *release_file_info
      - src: LICENSE
        info: *release_file_info
      - src: adapters/cpp/README.md
        info: *release_file_info
      - src: adapters/typescript/README.md
        info: *release_file_info
      - src: adapters/jvm/README.md
        info: *release_file_info
      - src: adapters/ctags/README.md
        info: *release_file_info

sboms:
  - id: archive-spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./adapter-dist/*

release:
  # A tag workflow promotes the draft only after local artifact validation and
  # keyless provenance succeed. A failure leaves a recoverable private draft.
  draft: true
  extra_files:
    - glob: ./adapter-dist/*

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
