name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Test
        run: go test ./...
      - name: Package .NET companion
        env:
          WEAVE_DOTNET_RIDS: linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64
        run: scripts/package-dotnet-adapter.sh "${GITHUB_REF_NAME#v}" adapter-dist
      - name: Package Python companion
        run: python -m pip wheel --no-deps ./adapters/python --wheel-dir adapter-dist
      - name: Verify Python companion
        run: |
          python -m pip install --no-index --find-links adapter-dist weave-python-adapter
          python -m unittest discover -s adapters/python/tests -p "test_*.py" -v
          go build -o "$RUNNER_TEMP/weave" ./cmd/weave
          python adapters/python/tests/e2e.py "$RUNNER_TEMP/weave"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
