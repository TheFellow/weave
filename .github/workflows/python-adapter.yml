name: Python adapter

on:
  push:
    paths:
      - "adapters/python/**"
      - "internal/adapter/**"
      - "internal/nativeindex/**"
      - "internal/repository/**"
      - "internal/application/**"
      - "internal/graph/**"
      - "protocol/adapter/**"
      - ".github/workflows/python-adapter.yml"
  pull_request:
    paths:
      - "adapters/python/**"
      - "internal/adapter/**"
      - "internal/nativeindex/**"
      - "internal/repository/**"
      - "internal/application/**"
      - "internal/graph/**"
      - "protocol/adapter/**"
      - ".github/workflows/python-adapter.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: adapters/python/pyproject.toml
      - name: Build wheel
        run: python -m pip wheel --no-deps ./adapters/python --wheel-dir "${{ runner.temp }}/wheel"
      - name: Install built wheel
        run: python -m pip install --no-index --find-links "${{ runner.temp }}/wheel" weave-python-adapter
      - name: Python contract and semantic tests
        run: python -m unittest discover -s adapters/python/tests -p "test_*.py" -v
      - name: Go host contract tests
        run: go test ./internal/adapter ./internal/nativeindex ./internal/application
      - name: Build Weave
        run: go build -o "${{ runner.temp }}/weave${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/weave
      - name: Query-driven refresh smoke test
        run: python adapters/python/tests/e2e.py "${{ runner.temp }}/weave${{ runner.os == 'Windows' && '.exe' || '' }}"
