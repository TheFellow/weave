name: TypeScript and JavaScript adapter

on:
  push:
    paths:
      - "adapters/typescript/**"
      - "cmd/weave/**"
      - "internal/adapter/**"
      - "internal/application/**"
      - "internal/freshness/**"
      - "internal/graph/**"
      - "internal/nativeindex/**"
      - "internal/scipimport/**"
      - "protocol/adapter/**"
      - ".github/workflows/typescript-adapter.yml"
  pull_request:
    paths:
      - "adapters/typescript/**"
      - "cmd/weave/**"
      - "internal/adapter/**"
      - "internal/application/**"
      - "internal/freshness/**"
      - "internal/graph/**"
      - "internal/nativeindex/**"
      - "internal/scipimport/**"
      - "protocol/adapter/**"
      - ".github/workflows/typescript-adapter.yml"

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Adapter and host contract tests
        run: go test ./adapters/typescript/... ./internal/adapter ./internal/scipimport ./internal/nativeindex ./internal/application
      - name: Build adapter
        run: go build ./adapters/typescript/cmd/weave-typescript

  real-indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: adapters/typescript/toolchain/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install locked scip-typescript toolchain
        shell: bash
        run: |
          adapters/typescript/scripts/install-scip-typescript.sh
          echo "$GITHUB_WORKSPACE/adapters/typescript/toolchain/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build Weave and adapter
        shell: bash
        run: |
          go build -o "${{ runner.temp }}/weave" ./cmd/weave
          go build -o "${{ runner.temp }}/weave-typescript" ./adapters/typescript/cmd/weave-typescript
      - name: Real TypeScript and JavaScript semantic indexing smoke test
        shell: bash
        run: python adapters/typescript/tests/e2e.py "${{ runner.temp }}/weave" "${{ runner.temp }}/weave-typescript"
