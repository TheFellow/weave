name: .NET adapter

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "adapters/dotnet/**"
      - "scripts/package-dotnet-adapter.sh"
      - ".github/workflows/dotnet-adapter.yml"
  pull_request:
    paths:
      - "adapters/dotnet/**"
      - "scripts/package-dotnet-adapter.sh"
      - ".github/workflows/dotnet-adapter.yml"

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: adapters/dotnet/**/packages*.lock.json
      - name: Restore
        run: dotnet restore adapters/dotnet/Weave.Adapter.sln --locked-mode
      - name: Build
        run: dotnet build adapters/dotnet/Weave.Adapter.sln --no-restore --configuration Release
      - name: Restore mixed-language fixture
        run: dotnet restore adapters/dotnet/tests/fixtures/Mixed/Mixed.sln --locked-mode
      - name: Prepare mixed-language fixture
        run: dotnet build adapters/dotnet/tests/fixtures/Mixed/Mixed.sln --no-restore --configuration Debug
      - name: Test
        run: dotnet test adapters/dotnet/Weave.Adapter.sln --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Dry-run release package
        shell: bash
        env:
          WEAVE_DOTNET_RIDS: ${{ matrix.rid }}
          WEAVE_DOTNET_VERIFY_RID: ${{ matrix.rid }}
        run: scripts/package-dotnet-adapter.sh 0.0.0-ci "${RUNNER_TEMP}/weave-dotnet-dist"
