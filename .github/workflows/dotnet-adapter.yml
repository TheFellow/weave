name: .NET adapter

on:
  push:
    paths:
      - "adapters/dotnet/**"
      - ".github/workflows/dotnet-adapter.yml"
  pull_request:
    paths:
      - "adapters/dotnet/**"
      - ".github/workflows/dotnet-adapter.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore adapters/dotnet/Weave.Adapter.sln
      - name: Build
        run: dotnet build adapters/dotnet/Weave.Adapter.sln --no-restore --configuration Release
      - name: Prepare mixed-language fixture
        run: dotnet build adapters/dotnet/tests/fixtures/Mixed/Mixed.sln --configuration Debug
      - name: Test
        run: dotnet test adapters/dotnet/Weave.Adapter.sln --no-build --configuration Release --logger "console;verbosity=normal"
