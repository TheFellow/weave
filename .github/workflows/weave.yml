name: weave

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  semantic-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Weave
        run: go build -o "$RUNNER_TEMP/weave" ./cmd/weave
      - name: Compute semantic cache key
        id: weave_key
        run: |
          echo "key=$($RUNNER_TEMP/weave ci key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git/weave
          key: "${{ steps.weave_key.outputs.key }}"
      - name: Build or reuse semantic index
        run: |
          "$RUNNER_TEMP/weave" ci index
      - name: Verify graph and architecture policy
        run: |
          "$RUNNER_TEMP/weave" ci check --format sarif > weave.sarif
      - name: Upload policy results
        if: always() && hashFiles('weave.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: weave.sarif
      - name: Preserve deterministic graph export
        if: always()
        run: |
          "$RUNNER_TEMP/weave" export --json > weave-export.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weave-${{ runner.os }}-${{ github.sha }}
          path: |
            weave.sarif
            weave-export.json
