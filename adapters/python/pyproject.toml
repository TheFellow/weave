[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-python-adapter"
dynamic = ["version"]
description = "Compiler-native Python lexical adapter for Weave"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "TheFellow"}]
dependencies = []

[project.scripts]
weave-python = "weave_python.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "weave_python.__version__"}
