[package]
name = "weave-rust-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "rust-analyzer/SCIP semantic adapter for Weave"
repository = "https://github.com/TheFellow/weave"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "weave-rust"
path = "src/main.rs"

[dependencies]
protobuf = "=3.7.2"
scip = "=0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = "symbols"
